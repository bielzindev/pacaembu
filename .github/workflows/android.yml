name: Android build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Pacaembu.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Pacaembu-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pacaembu-${{ github.run_number }}
          path: out/*.apk

      - name: Publish release build-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/Pacaembu.apk out/Pacaembu-debug.apk \
            --target "${{ github.sha }}" \
            --title "Pacaembu build ${{ github.run_number }}" \
            --notes "Branch ${{ github.ref_name }}, commit ${{ github.sha }}. Install Pacaembu.apk and choose Pacaembu as the Home app."
